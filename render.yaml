services:
  - type: web
    name: jrcacambas
    runtime: node
    plan: free
    region: oregon
    branch: feature/agendamento-clientes
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.16.0"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
